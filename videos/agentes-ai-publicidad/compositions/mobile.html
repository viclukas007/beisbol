<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=768, height=256">
  <title>Agentes AI — publicidad móvil</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    @font-face { font-family: 'Plus Jakarta Sans'; src: url('assets/fonts/plus-jakarta-sans.ttf') format('truetype'); font-weight: 200 800; font-style: normal; font-display: block; }
    :root { --bg: #05070f; --accent: #4f63ff; --support: #22d3ee; --green: #22c55e; --ink: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 768px; height: 256px; overflow: hidden; background: var(--bg); }
    #stage { position: relative; width: 100%; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Plus Jakarta Sans', sans-serif; }
    .banner-layout { display: grid; grid-template-columns: 218px minmax(0, 1fr); align-items: center; gap: 36px; width: 100%; height: 100%; padding: 23px 28px; }
    .brand { display: block; width: 218px; height: 82px; object-fit: contain; }
    .message { min-width: 0; display: flex; flex-direction: column; gap: 9px; }
    /* Dedicated mobile recomposition of installed line-swap component. */
    .ls-mask { position: relative; width: 100%; height: 112px; overflow: hidden; }
    .ls-line { position: absolute; inset: 0; display: flex; align-items: center; font-size: 42px; font-weight: 800; line-height: 1.12; letter-spacing: -0.025em; will-change: transform, opacity; }
    .ls-line-inner { display: block; width: 100%; white-space: pre-line; }
    .ls-line-b { opacity: 0; }
    .support { height: 34px; color: var(--support); font-size: 25px; font-weight: 600; line-height: 34px; white-space: nowrap; }
    .cta { display: flex; align-items: center; justify-content: center; width: 246px; height: 44px; margin-top: 2px; border-radius: 11px; background: var(--accent); color: var(--ink); font-size: 24px; font-weight: 700; line-height: 1.1; }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="agentes-ai-mobile" data-start="0" data-duration="8" data-fps="30" data-width="768" data-height="256">
    <div id="agentes-ai-mobile-banner" class="banner-layout clip" data-start="0" data-duration="8" data-track-index="0">
      <img id="agentes-ai-mobile-logo" class="brand" src="assets/logo-white.png" alt="Agentes AI by Cuatro Monos">
      <div class="message">
        <div class="ls-mask" aria-label="Responde a tus clientes. Organiza tu seguimiento.">
          <div id="agentes-ai-mobile-line-a" class="ls-line ls-line-a"><span class="ls-line-inner">Responde a tus
clientes</span></div>
          <div id="agentes-ai-mobile-line-b" class="ls-line ls-line-b"><span class="ls-line-inner">Organiza tu
seguimiento</span></div>
        </div>
        <div class="support">WhatsApp · Redes · CRM</div>
        <div class="cta">Solicitar demo</div>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.set('#agentes-ai-mobile-line-a', { x: 0, y: 0, opacity: 1 }, 0);
    tl.set('#agentes-ai-mobile-line-b', { x: 0, y: 8, opacity: 0 }, 0);
    tl.fromTo('#agentes-ai-mobile-line-a', { y: 0, opacity: 1 }, { y: -8, opacity: 0, duration: 0.4, ease: 'power2.inOut', immediateRender: false }, 3.6);
    tl.fromTo('#agentes-ai-mobile-line-b', { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power2.inOut', immediateRender: false }, 3.6);
    tl.fromTo('#agentes-ai-mobile-line-b', { y: 0, opacity: 1 }, { y: -8, opacity: 0, duration: 0.4, ease: 'power2.inOut', immediateRender: false }, 7.2);
    tl.fromTo('#agentes-ai-mobile-line-a', { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power2.inOut', immediateRender: false }, 7.2);
    tl.set('#agentes-ai-mobile-line-b', { x: 0, y: 8, opacity: 0 }, 7.6);
    tl.set('#agentes-ai-mobile-line-a', { x: 0, y: 0, opacity: 1 }, 8);
    window.__timelines = window.__timelines || {};
    window.__timelines['agentes-ai-mobile'] = tl;
    tl.seek(0);
  </script>
</body>
</html>
