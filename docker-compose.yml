name: diamante-beisbol
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: diamante
      POSTGRES_USER: diamante
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diamante -d diamante"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    volumes:
      - ./public/ads:/app/public/ads:ro
    environment:
      DATABASE_URL: postgres://diamante:${POSTGRES_PASSWORD}@db:5432/diamante
      PORT: 3080
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL en .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Define ADMIN_PASSWORD_HASH en .env}
    ports:
      - "127.0.0.1:${APP_PORT:-3080}:3080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
volumes:
  postgres_data:
